[pytest]
# ============================================================
# Pytest配置文件 - 低空空管自动化系统
# ============================================================

# 测试文件搜索路径
testpaths = tests

# 测试文件匹配模式
python_files = test_*.py

# 测试类匹配模式
python_classes = Test*

# 测试函数匹配模式
python_functions = test_*

# 命令行默认参数
addopts =
    -v
    --strict-markers
    --tb=short
    --alluredir=reports/allure-results
    --clean-alluredir
    --reruns 2
    --reruns-delay 3

# 自定义标记注册
markers =
    smoke: 冒烟测试 - 核心功能快速验证
    login: 登录模块测试
    home: 首页模块测试
    flight: 飞行计划(申报)模块测试
    news: 资讯模块测试
    mine: 我的模块测试
    gps: GPS定位相关测试
    offline: 离线/断网测试
    slow: 执行较慢的测试
    install: APK安装/卸载/升级测试
    lifecycle: App生命周期测试(启动/关闭/后台)
    perf: 性能采集与基线测试
    weaknet: 弱网/断网测试
    stability: 稳定性测试(monkey/ANR)
    monkey: monkey压力测试(长耗时)
    register: 注册模块测试(预留, 未就绪自动跳过)
    alert_detail: 告警详情页面测试
    plan_ops: 飞行计划操作测试(状态流转/推延/取消)
    data_file: 从YAML文件加载测试数据 (@pytest.mark.data_file("path"))

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s(%(filename)s:%(lineno)d): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 超时设置
timeout = 300
