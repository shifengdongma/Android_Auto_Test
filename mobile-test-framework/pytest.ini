[pytest]
# ============================================================
# Pytest配置文件 - 低空空管自动化系统
# ============================================================

# 测试文件搜索路径
testpaths = tests

# 测试文件匹配模式
python_files = test_*.py

# 测试类匹配模式
python_classes = Test*

# 测试函数匹配模式
python_functions = test_*

# 命令行默认参数
addopts =
    -v
    --strict-markers
    --tb=short
    --alluredir=reports/allure-results
    --clean-alluredir
    --reruns 2
    --reruns-delay 3

# 自定义标记注册
markers =
    smoke: 冒烟测试 - 核心功能快速验证
    login: 登录模块测试
    home: 首页模块测试
    flight: 飞行计划(申报)模块测试
    news: 资讯模块测试
    mine: 我的模块测试
    gps: GPS定位相关测试
    offline: 离线/断网测试
    slow: 执行较慢的测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s(%(filename)s:%(lineno)d): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 超时设置
timeout = 300
