<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>计划详情 - 低空空管APP</title>
<style>
:root{--mp-bg:#0b0f18;--mp-card:#111826;--mp-surface:#141414;--mp-nav:#1a1d24;--mp-text:#e7edf7;--mp-muted:#9aa7bb;--mp-border:#2a2f3a;--mp-blue:#2f7cf6;--mp-green:#38d46f;--mp-orange:#ff9f43;--mp-red:#ff6a6a;--mp-radius:12px;--mp-status-h:44px;--mp-safe-b:34px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.phone{width:390px;height:844px;background:var(--mp-bg);border-radius:40px;border:8px solid #2a2a2a;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.status-bar{height:var(--mp-status-h);display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;color:var(--mp-text);flex-shrink:0}
.status-bar .time{font-weight:600}
.status-bar .icons{display:flex;gap:6px;align-items:center}
.page-header{height:44px;display:flex;align-items:center;padding:0 16px;flex-shrink:0;border-bottom:1px solid var(--mp-border)}
.page-header .back{color:var(--mp-text);text-decoration:none;font-size:18px;width:24px;cursor:pointer}
.page-header .title{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--mp-text)}
.page-header .placeholder{width:24px}
.content{flex:1;overflow-y:auto;padding:14px 16px 24px}
.content::-webkit-scrollbar{display:none}
/* 状态横幅 */
.status-banner{display:flex;align-items:center;gap:8px;background:var(--mp-card);border:1px solid var(--mp-border);border-radius:var(--mp-radius);padding:12px 14px;margin-bottom:16px}
.status-banner .sb-no{font-size:12px;color:var(--mp-muted);flex:1}
.status-tag{padding:3px 10px;border-radius:8px;font-size:12px;white-space:nowrap}
.status-pending{background:rgba(47,124,246,.15);color:var(--mp-blue)}
.status-rejected{background:rgba(255,106,106,.15);color:var(--mp-red)}
.status-done{background:rgba(154,167,187,.15);color:var(--mp-muted)}
/* 区块 */
.section{background:var(--mp-card);border:1px solid var(--mp-border);border-radius:var(--mp-radius);padding:14px;margin-bottom:14px}
.section-title{font-size:14px;font-weight:600;color:var(--mp-text);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.section-title .bar{width:3px;height:14px;background:var(--mp-blue);border-radius:2px}
/* 航路（无地图，文字线路） */
.route-line{display:flex;align-items:flex-start;gap:10px}
.route-line .rl-track{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.route-line .rl-track .dot{width:10px;height:10px;border-radius:50%}
.route-line .rl-track .dot.start{background:var(--mp-green)}
.route-line .rl-track .dot.end{background:var(--mp-orange)}
.route-line .rl-track .vline{width:2px;flex:1;min-height:26px;background:var(--mp-border);margin:3px 0}
.route-line .rl-points{flex:1}
.route-line .rl-points .pt{font-size:14px;color:var(--mp-text);line-height:18px}
.route-line .rl-points .pt-label{font-size:11px;color:var(--mp-muted);margin-bottom:2px}
.route-line .rl-points .pt-gap{height:18px}
.route-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--mp-border)}
.route-meta .chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:rgba(47,124,246,.1);border:1px solid rgba(47,124,246,.3);border-radius:14px;font-size:12px;color:var(--mp-blue)}
.route-meta .chip.plain{background:var(--mp-surface);border-color:var(--mp-border);color:var(--mp-muted)}
/* 信息行 */
.info-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--mp-border)}
.info-row:last-child{border-bottom:none;padding-bottom:0}
.info-row:first-child{padding-top:0}
.info-row .k{font-size:13px;color:var(--mp-muted);flex-shrink:0}
.info-row .v{font-size:13px;color:var(--mp-text);text-align:right;line-height:1.4}
/* 文件 */
.file-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--mp-border)}
.file-row:last-child{border-bottom:none;padding-bottom:0}
.file-row .f-ico{font-size:20px}
.file-row .f-name{font-size:13px;color:var(--mp-text);flex:1}
.file-row .f-view{font-size:12px;color:var(--mp-blue);cursor:pointer}
/* 驳回原因 */
.reject-box{font-size:12px;color:var(--mp-red);background:rgba(255,106,106,.08);border:1px solid rgba(255,106,106,.25);border-radius:8px;padding:9px 11px;line-height:1.5}
/* 更多折叠 */
.more-toggle{display:flex;align-items:center;gap:4px;padding:10px 0 2px;cursor:pointer;font-size:13px;color:var(--mp-blue)}
.more-toggle .mt-arrow{font-size:10px;transition:transform .2s}
.more-toggle.open .mt-arrow{transform:rotate(90deg)}
.more-body{display:none}
.more-body.open{display:block}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span class="time">9:41</span><div class="icons"><span>&#9679;</span><span>&#9679;</span><span>&#128267;</span></div></div>
  <div class="page-header"><a class="back" id="backBtn" href="小程序_审批进度.html">&#10094;</a><div class="title">计划详情</div><div class="placeholder"></div></div>
  <div class="content">

    <!-- 状态 -->
    <div class="status-banner">
      <span class="sb-no">计划编号：FP-20260608-0014</span>
      <span class="status-tag status-pending">审批中</span>
    </div>

    <!-- 航路（无地图，文字线路） -->
    <div class="section">
      <div class="section-title"><span class="bar"></span>航路</div>
      <div class="route-line">
        <div class="rl-track">
          <span class="dot start"></span>
          <span class="vline"></span>
          <span class="dot end"></span>
        </div>
        <div class="rl-points">
          <div class="pt-label">出发</div>
          <div class="pt">滨江起降场</div>
          <div class="pt-gap"></div>
          <div class="pt-label">到达</div>
          <div class="pt">科技园起降场</div>
        </div>
      </div>
    </div>

    <!-- 基础信息 -->
    <div class="section">
      <div class="section-title"><span class="bar"></span>基础信息</div>
      <div class="info-row"><span class="k">执飞时段</span><span class="v">2026-06-08 14:00:00<br/>~ 16:00:00</span></div>
      <div class="info-row"><span class="k">航空器</span><span class="v">DJI Mavic 3<br/>大疆 经纬 M350</span></div>
      <div class="info-row"><span class="k">操控员</span><span class="v">张三、李四</span></div>
      <div class="info-row"><span class="k">计划性质</span><span class="v">物流运维</span></div>
      <div class="more-toggle" id="moreToggle" onclick="toggleMore()"><span>更多</span><span class="mt-arrow">&#10095;</span></div>
      <div class="more-body" id="moreBody">
        <div class="info-row"><span class="k">计划名称</span><span class="v">张三-2026-06-08 14:00:00</span></div>
        <div class="info-row"><span class="k">观测员</span><span class="v">—</span></div>
        <div class="info-row"><span class="k">计划类型</span><span class="v">单次</span></div>
      </div>
    </div>

    <!-- 文件资料 -->
    <div class="section">
      <div class="section-title"><span class="bar"></span>文件资料</div>
      <div class="file-row">
        <span class="f-ico">&#128196;</span>
        <span class="f-name">空域批复.pdf</span>
        <span class="f-view">查看</span>
      </div>
    </div>

  </div>
</div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var from = params.get('from');
  var backBtn = document.getElementById('backBtn');
  if(from === 'home'){
    backBtn.href = '小程序_首页.html';
  } else {
    backBtn.href = '小程序_审批进度.html';
  }
})();
function toggleMore(){
  document.getElementById('moreToggle').classList.toggle('open');
  document.getElementById('moreBody').classList.toggle('open');
}
</script>
</body>
</html>
