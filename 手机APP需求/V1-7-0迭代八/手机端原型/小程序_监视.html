<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>监视 - 低空空管小程序</title>
<style>
:root{--mp-bg:#0b0f18;--mp-card:#111826;--mp-surface:#141414;--mp-nav:#1a1d24;--mp-text:#e7edf7;--mp-muted:#9aa7bb;--mp-border:#2a2f3a;--mp-blue:#2f7cf6;--mp-green:#38d46f;--mp-orange:#ff9f43;--mp-red:#ff6a6a;--mp-radius:12px;--mp-tab-h:56px;--mp-status-h:44px;--mp-safe-b:34px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.phone{width:390px;height:844px;background:var(--mp-bg);border-radius:40px;border:8px solid #2a2a2a;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.status-bar{height:var(--mp-status-h);display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;color:var(--mp-text);flex-shrink:0;position:relative;z-index:10}
.status-bar .time{font-weight:600}
.status-bar .icons{display:flex;gap:6px;align-items:center}
.content{flex:1;overflow:hidden;position:relative}
.tab-bar{height:calc(var(--mp-tab-h) + var(--mp-safe-b));background:var(--mp-nav);border-top:1px solid var(--mp-border);display:flex;align-items:flex-start;padding-top:8px;flex-shrink:0;position:relative;z-index:10}
.tab-bar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--mp-muted);font-size:10px}
.tab-bar a.active{color:var(--mp-blue)}
.tab-bar a .icon{font-size:22px;height:26px;display:flex;align-items:center;justify-content:center}
.map-bg{position:absolute;inset:0;background:linear-gradient(160deg,#0a1628 0%,#0f2035 30%,#0a1a2f 60%,#081420 100%)}
.map-grid{position:absolute;inset:0;opacity:.15;background-image:linear-gradient(rgba(47,124,246,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(47,124,246,.3) 1px,transparent 1px);background-size:40px 40px}
.map-route{position:absolute;top:35%;left:20%;width:60%;height:30%}
.map-route svg{width:100%;height:100%}
.aircraft-dot{position:absolute;top:38%;left:55%;width:16px;height:16px;background:var(--mp-green);border-radius:50%;box-shadow:0 0 12px var(--mp-green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.3)}}
.flight-card{position:absolute;bottom:16px;left:16px;right:16px;background:var(--mp-card);border-radius:var(--mp-radius);border:1px solid var(--mp-border);padding:14px;z-index:5}
.flight-card .fc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.flight-card .fc-title{font-size:14px;font-weight:600;color:var(--mp-text)}
.flight-card .fc-status{padding:3px 8px;border-radius:8px;font-size:11px;background:rgba(56,212,111,.15);color:var(--mp-green)}
.flight-card .fc-info{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flight-card .fc-item{font-size:12px}
.flight-card .fc-item .label{color:var(--mp-muted);margin-bottom:2px}
.flight-card .fc-item .value{color:var(--mp-text)}
.flight-list-toggle{position:absolute;top:50px;right:16px;background:var(--mp-card);border:1px solid var(--mp-border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--mp-text);z-index:5;cursor:pointer}
.back-btn{position:absolute;top:50px;left:16px;display:flex;align-items:center;gap:6px;background:rgba(17,24,38,.9);border:1px solid var(--mp-border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--mp-text);z-index:5;cursor:pointer;text-decoration:none}
.conn-status{position:absolute;top:50px;left:90px;display:flex;align-items:center;gap:6px;background:rgba(17,24,38,.9);border:1px solid var(--mp-border);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--mp-green);z-index:5}
.conn-status .dot{width:6px;height:6px;border-radius:50%;background:var(--mp-green)}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span class="time">9:41</span><div class="icons"><span>&#9679;</span><span>&#9679;</span><span>&#128267;</span></div></div>
  <div class="content">
    <div class="map-bg"></div>
    <div class="map-grid"></div>
    <svg style="position:absolute;top:30%;left:15%;width:70%;height:35%;z-index:2" viewBox="0 0 200 100">
      <polyline points="20,80 60,50 120,40 180,20" fill="none" stroke="#2f7cf6" stroke-width="2" stroke-dasharray="4,4" opacity=".7"/>
      <circle cx="20" cy="80" r="4" fill="#2f7cf6"/>
      <circle cx="180" cy="20" r="4" fill="#ff9f43"/>
      <circle cx="120" cy="40" r="6" fill="#38d46f" stroke="#38d46f" stroke-width="3" opacity=".8"/>
    </svg>
    <a class="back-btn" href="小程序_审批进度.html">&#10094; 返回</a>
    <div class="conn-status"><span class="dot"></span>实时连接中</div>
    <div class="flight-list-toggle">&#9776; 2架执飞中</div>
    <div class="flight-card">
      <div class="fc-header"><span class="fc-title">胡利平-2026-05-26 09:00</span><span class="fc-status">执飞中</span></div>
      <div class="fc-info">
        <div class="fc-item"><div class="label">起飞点</div><div class="value">南山起降场</div></div>
        <div class="fc-item"><div class="label">降落点</div><div class="value">宝安起降场</div></div>
        <div class="fc-item"><div class="label">航空器</div><div class="value">DJI Mavic 3</div></div>
        <div class="fc-item"><div class="label">已飞行</div><div class="value">12分钟</div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
